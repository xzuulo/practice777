<!doctype html>
<html>
    <head>
        <title>News App</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body style="background-color: gainsboro;">
        <div class="container">
            <h1><img src="https://img.icons8.ru/?size=100&id=103227&format=png&color=000000" alt="лого" style="width: 3%;"> Черный дельфин</h1>

            <div style="display: flex; justify-content: center;">
                <input id="searchInput" placeholder="Введите запрос..." style="border-radius: 8px;height: 8vh;width: 50vw;  font-size: 20px; text-align: center;"/>
                <button id="searchBtn" style="border-radius: 8px;width:5vw;height: 9vh;  font-size: 30px;">🔍</button>
            </div>


            <h2>Результаты поиска:</h2>
            <div id="newsContainer"></div>

            <h2>Сохраненные новости:</h2>
            <div id="savedContainer"></div>
        </div>

        <script src="js/app.js"></script>
    </body>
</html>
